edition = "2026";

package beamlet.v1;

// Beamlet 跨角色与跨进程逻辑消息契约, 与具体传输后端及线编码格式无关.
// 业务请求与结果载荷统一使用 bytes 表示任意不透明数据.

// Worker 自报的接收状态; 失联状态由观察方按本地单调时钟另行判定.
export enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  // 可以尝试投递调用, 不表示已预留执行槽位.
  PRESENCE_STATE_READY = 1;
  // 已停止接收新调用, 正在排空已入队任务.
  PRESENCE_STATE_DRAINING = 2;
  // 本会话已正常退出; 重启必须更换新的 session_id.
  PRESENCE_STATE_OFFLINE = 3;
}

// 针对某个指定 Operation 的单次执行授权.
export message Attempt {
  string attempt_id = 1;
  string operation_id = 2;
}

// 一次 Attempt 执行结束后的结果证据, 保留双引用关联.
export message Report {
  string report_id = 1;
  string operation_id = 2;
  string attempt_id = 3;
  bytes result = 4;
}

// 持久角色标识与单次运行会话标识组合, 不按标识大小或字典序推断新旧.
export message RoleInstance {
  string role_id = 1;
  string session_id = 2;
}

// Authority 对外发现回复携带的实例与所属 Pool 集合.
export message AuthorityInfo {
  RoleInstance instance = 1;
  repeated string pools = 2;
}

// Worker 发布的完整状态快照, 首份有效快照即可完成登记.
export message Presence {
  string pool = 1;
  RoleInstance instance = 2;
  repeated string capabilities = 3;
  uint64 sequence = 4;
  PresenceState state = 5;
}

// Authority 观察到的 Worker 状态视图.
export message WorkerView {
  Presence presence = 1;
  bool stale = 2;
}

// 从指定 Pool 与能力匹配的可用 Worker 候选中任选其一.
export message SelectionAny {}

// Worker 选择策略: 任选可用实例或精确锁定唯一实例.
export message Selection {
  oneof kind {
    SelectionAny any = 1;
    RoleInstance exact = 2;
  }
}

// Authority 发现回复.
export message DiscoveryReply {
  string request_id = 1;
  AuthorityInfo authority = 2;
}

// 不可变业务任务描述, 作为 Operation 的原始请求输入.
export message Task {
  string capability = 1;
  bytes payload = 2;
}

// 外部调用方提交创建请求的描述, 本身尚未创建 Operation 或签发 Attempt.
export message Submission {
  string pool = 1;
  Selection worker = 2;
  Task task = 3;
}

// 查询指定 Pool 的 Worker 快照, 可选按能力过滤.
export message CommandWorkers {
  string request_id = 1;
  RoleInstance authority = 2;
  string pool = 3;
  string capability = 4;
}

// 请求目标 Authority 创建 Operation 并执行一次交付.
export message CommandSubmit {
  string request_id = 1;
  RoleInstance authority = 2;
  Submission submission = 3;
}

// Authority 请求入口命令.
export message Command {
  oneof kind {
    CommandWorkers workers = 1;
    CommandSubmit submit = 2;
  }
}

// 创建 Operation 前的拒绝结果.
export message OutcomeRejected {
  string reason = 1;
}

// Worker 视图查询结果.
export message OutcomeWorkers {
  repeated WorkerView workers = 1;
}

// 有效 Report 已被接受且 Operation 已关闭的完成结果.
export message OutcomeCompleted {
  string operation_id = 1;
  string attempt_id = 2;
  string report_id = 3;
  RoleInstance worker = 4;
  bytes result = 5;
}

// 已签发 Attempt 但未能取得有效 Report 的未解决结果.
export message OutcomeUnresolved {
  string operation_id = 1;
  string attempt_id = 2;
  RoleInstance worker = 3;
  string reason = 4;
}

// Authority 对外返回的四态结果; 未解决结果绝不伪装成 Report.
export message Outcome {
  oneof kind {
    OutcomeRejected rejected = 1;
    OutcomeWorkers workers = 2;
    OutcomeCompleted completed = 3;
    OutcomeUnresolved unresolved = 4;
  }
}

// Authority 对请求方的关联回复.
export message Reply {
  string request_id = 1;
  RoleInstance authority = 2;
  Outcome outcome = 3;
}

// 发往唯一选定 Worker 的调用数据, 仅携带既有 Attempt 授权.
export message Call {
  string pool = 1;
  RoleInstance authority = 2;
  RoleInstance worker = 3;
  Attempt attempt = 4;
  string capability = 5;
  bytes payload = 6;
}

// Worker 对单次 Call 的一次性响应: 正常生成 Report 或执行期失败通知.
export message WorkerResponse {
  oneof kind {
    Report report = 1;
    string failed = 2;
  }
}
