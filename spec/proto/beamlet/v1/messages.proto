edition = "2026";

package beamlet.v1;

// Beamlet Authority 与 Worker 之间的跨角色逻辑消息契约, 与具体实现语言及传输后端无关.
// 业务请求与结果载荷统一使用 bytes 表示任意不透明数据.

// Worker 自报的接收状态; 失联状态由观察方按本地单调时钟另行判定.
export enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  // 正在接收新派发, 不表示已预留执行槽位.
  PRESENCE_STATE_ACCEPTING = 1;
  // 已停止接收新派发, 正在完成已接收的在途任务.
  PRESENCE_STATE_DRAINING = 2;
  // 本会话已正常退出; 重启必须更换新的 session_id.
  PRESENCE_STATE_OFFLINE = 3;
}

// 针对某个指定 Operation 的单次执行授权.
export message Attempt {
  string attempt_id = 1;
  string operation_id = 2;
}

// 一次 Attempt 执行结束后的结果证据, 保留双引用关联.
export message Report {
  string report_id = 1;
  string operation_id = 2;
  string attempt_id = 3;
  bytes result = 4;
}

// 持久角色标识与单次运行会话标识组合, 不按标识大小或字典序推断新旧.
export message RoleSession {
  string role_id = 1;
  string session_id = 2;
}

// Worker 发布的完整状态快照, 首份有效快照即可完成登记.
export message Presence {
  string pool = 1;
  RoleSession session = 2;
  repeated string capabilities = 3;
  uint64 sequence = 4;
  PresenceState state = 5;
}

// 不可变业务任务描述, 携带精确能力标识与不透明业务载荷.
export message Task {
  string capability = 1;
  bytes payload = 2;
}

// 发往唯一选定 Worker 的派发消息, 直接携带既有 Attempt 授权与 Task.
export message Dispatch {
  string pool = 1;
  RoleSession authority = 2;
  RoleSession worker = 3;
  Attempt attempt = 4;
  Task task = 5;
}

// Worker 对单次 Dispatch 的一次性响应: 正常生成 Report 或执行期失败通知.
export message DispatchReply {
  oneof kind {
    Report report = 1;
    string failed = 2;
  }
}
