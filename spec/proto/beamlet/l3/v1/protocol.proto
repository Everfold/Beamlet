edition = "2026";

package beamlet.l3.v1;

import "beamlet/l1/v1/primitives.proto";

// 持久角色身份与单次运行会话的组合, 共同锁定一次具体角色运行.
export message RoleInstance {
  // 持久配置的角色 UUID, 不允许全零 UUID.
  string role_id = 1;
  // 本次运行独立生成的会话 UUID, 不允许全零 UUID, 不按字典序判断新旧.
  string session_id = 2;
}

// 本地观测到的传输连接状态与世代.
export message Connection {
  // 本地单调递增的连接世代; 世代变更后旧世代租约立即失效.
  uint64 epoch = 1;
  // 当前链路是否处于可尝试通信的已连接状态.
  bool connected = 2;
}

// Worker 单会话内的单调接收状态格: Ready -> Draining -> Offline (不可逆).
export enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  // 可以尝试交付调用, 但不代表预留了执行槽位.
  PRESENCE_STATE_READY = 1;
  // 已停止接收新调用, 正在排空已入队调用.
  PRESENCE_STATE_DRAINING = 2;
  // 本会话已正常退出; 重启必须使用新的 session_id.
  PRESENCE_STATE_OFFLINE = 3;
}

// Worker 发布的完整状态快照, 首份有效快照即可用于登记.
export message Presence {
  // Worker 所属的唯一 pool (1..=64 字节 ASCII 字母, 数字, '-' 或 '_').
  string pool = 1;
  // Worker 实例身份.
  RoleInstance instance = 2;
  // 本次运行实际启用的能力标识集合 (每项 1..=256 字节).
  repeated string capabilities = 3;
  // 本次公告的单调状态.
  PresenceState state = 4;
}

// 表示从指定 pool 和能力匹配的可用 Worker 候选中任选一个实例.
export message SelectionAny {}

// Worker 选择策略: 任选可用实例或精确锁定唯一实例.
export message Selection {
  // 一次选择最多执行一次; Exact 失效时不回退到其他会话.
  oneof kind {
    SelectionAny any = 1;
    RoleInstance exact = 2;
  }
}

// 业务请求, 构成 Operation 的不可变原始输入.
export message Task {
  // 精确匹配的带版本能力标识 (1..=256 字节).
  string capability = 1;
  // 调用方定义的业务输入载荷.
  beamlet.l1.v1.OpaquePayload payload = 2;
}

// 外部向 Authority 提交任务的抽象输入上下文.
export message Submission {
  // 目标 pool 名称.
  string pool = 1;
  // 目标 Worker 选择约束.
  Selection worker = 2;
  // 待执行的业务 Task.
  Task task = 3;
}

// Authority 向唯一选定 Worker 实例发出的定向调用封套.
export message Call {
  // 路由 pool 名称.
  string pool = 1;
  // 签发授权的 Authority 实例.
  RoleInstance authority = 2;
  // 唯一目标 Worker 实例.
  RoleInstance worker = 3;
  // 已签发的执行授权, Worker 不得自行再签发.
  beamlet.l1.v1.Attempt attempt = 4;
  // 待执行的能力与业务输入.
  Task task = 5;
}

// Worker 对单次 Call 的一次性响应.
export message WorkerResponse {
  // 区分正常产出完整 Report, 执行前明确拒收与执行期异常失败.
  oneof kind {
    beamlet.l1.v1.Report report = 1;
    string rejected_reason = 2;
    string failed_reason = 3;
  }
}

// 创建 Operation 前的拒绝结果.
export message OutcomeRejected {
  // 拒绝的诊断原因.
  string reason = 1;
}

// 有效 Report 已接受且 Operation 已关闭的完成结果.
export message OutcomeCompleted {
  // 已分配的 Operation 身份.
  string operation_id = 1;
  // 已关联的 Attempt 身份.
  string attempt_id = 2;
  // Worker 生成的 Report 身份.
  string report_id = 3;
  // 实际执行该授权的 Worker 实例身份.
  RoleInstance worker = 4;
  // 执行产出的业务结果载荷.
  beamlet.l1.v1.OpaquePayload result = 5;
}

// 已签发 Attempt 但未能取得有效 Report 的未解决结果.
export message OutcomeUnresolved {
  // 已分配的 Operation 身份.
  string operation_id = 1;
  // 已签发的 Attempt 身份, Operation 仍保持等待此授权报告的状态.
  string attempt_id = 2;
  // 签发时锁定的目标 Worker 实例; 未取得报告不表示其未执行.
  RoleInstance worker = 3;
  // 交付失败或等待超时的诊断原因.
  string reason = 4;
}

// Authority 对外返回的统一三态语义结果.
export message Outcome {
  // 未解决结果绝不伪装成 Report.
  oneof kind {
    OutcomeRejected rejected = 1;
    OutcomeCompleted completed = 2;
    OutcomeUnresolved unresolved = 3;
  }
}
