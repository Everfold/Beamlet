edition = "2026";

package beamlet.l1.v1;

// 调用方定义的不透明业务载荷封套, 使下层契约不绑定具体业务结构或编码.
export message OpaquePayload {
  // 业务载荷的外部格式或 schema 标识, 下层不解析其语义.
  string schema = 1;
  // 编码后的原始业务字节流.
  bytes data = 2;
}

// 针对一个 Operation 的单次不可变执行授权.
export message Attempt {
  // 当前执行授权的唯一身份.
  string attempt_id = 1;
  // 本次授权所属的 Operation 身份.
  string operation_id = 2;
}

// 一次 Attempt 执行结束后的不可变结果证据, 保留双引用关联.
export message Report {
  // 本份结果证据的唯一身份.
  string report_id = 1;
  // 关联的 Operation 身份.
  string operation_id = 2;
  // 关联的 Attempt 身份.
  string attempt_id = 3;
  // 执行产生的业务结果载荷, 不用于判断结构转换合法性.
  OpaquePayload result = 4;
}
