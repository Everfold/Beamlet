edition = "2026";

package beamlet.protocol.v3;

// v3 跨进程 JSON 线协议 (VERSION = 3).
// 实际线上报文统一封装为 Envelope { version: 3, body: <message> }, 并启用未知字段拒绝.

// Worker 自报的接收状态; 失联由观察方按本地时间另行判定.
export enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  // 可以尝试投递调用, 不表示已预留执行槽位.
  PRESENCE_STATE_READY = 1;
  // 已停止接收新调用, 正在排空已入队任务.
  PRESENCE_STATE_DRAINING = 2;
  // 本会话已正常退出; 重启必须更换新的 session_id.
  PRESENCE_STATE_OFFLINE = 3;
}

// 持久角色 UUID 与单次运行会话 UUID 组合, 不按 UUID 大小推断新旧.
export message RoleInstance {
  string role_id = 1;
  string session_id = 2;
}

// Authority 对外发现回复携带的实例与 pool 信息.
export message AuthorityInfo {
  RoleInstance instance = 1;
  string label = 2;
  repeated string pools = 3;
}

// Worker 发布的完整状态快照, 首份快照即可完成登记.
export message Presence {
  string pool = 1;
  RoleInstance instance = 2;
  string label = 3;
  repeated string capabilities = 4;
  uint64 sequence = 5;
  PresenceState state = 6;
}

// Authority 观察到的 Worker 状态视图.
export message WorkerView {
  Presence presence = 1;
  uint64 last_seen_ms = 2;
  bool stale = 3;
}

// 从指定 pool 与能力匹配的可用 Worker 候选中任选其一.
export message SelectionAny {}

// Worker 选择策略: 任选可用实例或精确锁定唯一实例.
export message Selection {
  oneof kind {
    SelectionAny any = 1;
    RoleInstance exact = 2;
  }
}

// Authority 发现请求.
export message Discovery {
  string request_id = 1;
}

// Authority 发现回复.
export message DiscoveryReply {
  string request_id = 1;
  AuthorityInfo authority = 2;
}

// v3 文本业务请求, 作为 Operation 的原始请求输入.
export message Task {
  string capability = 1;
  string text = 2;
}

// 外部调用方提交创建请求的描述, 本身尚未创建 Operation 或签发 Attempt.
export message Submission {
  string pool = 1;
  Selection worker = 2;
  Task task = 3;
}

// 查询指定 pool 的 Worker 快照, 可选按能力过滤.
export message CommandWorkers {
  string request_id = 1;
  RoleInstance authority = 2;
  string pool = 3;
  string capability = 4;
}

// 请求目标 Authority 创建 Operation 并执行一次交付.
export message CommandSubmit {
  string request_id = 1;
  RoleInstance authority = 2;
  Submission submission = 3;
}

// Authority 请求入口命令.
export message Command {
  oneof kind {
    CommandWorkers workers = 1;
    CommandSubmit submit = 2;
  }
}

// 创建 Operation 前的拒绝结果.
export message OutcomeRejected {
  string reason = 1;
}

// Worker 视图查询结果.
export message OutcomeWorkers {
  repeated WorkerView workers = 1;
}

// 有效 Report 已被接受且 Operation 已关闭的完成结果.
export message OutcomeCompleted {
  string operation_id = 1;
  string attempt_id = 2;
  string report_id = 3;
  RoleInstance worker = 4;
  string result = 5;
}

// 已签发 Attempt 但未能取得有效 Report 的未解决结果.
export message OutcomeUnresolved {
  string operation_id = 1;
  string attempt_id = 2;
  RoleInstance worker = 3;
  string reason = 4;
}

// Authority 对外返回的四态结果; 未解决结果绝不伪装成 Report.
export message Outcome {
  oneof kind {
    OutcomeRejected rejected = 1;
    OutcomeWorkers workers = 2;
    OutcomeCompleted completed = 3;
    OutcomeUnresolved unresolved = 4;
  }
}

// Authority 对请求方的关联回复.
export message Reply {
  string request_id = 1;
  RoleInstance authority = 2;
  Outcome outcome = 3;
}

// 发往选定 Worker 的定向调用线格式, 仅携带既有 Attempt 授权.
export message WorkerCall {
  string pool = 1;
  RoleInstance authority = 2;
  RoleInstance worker = 3;
  string operation_id = 4;
  string attempt_id = 5;
  Task task = 6;
}

// 完整 Report 的线格式字段.
export message ReportData {
  string report_id = 1;
  string operation_id = 2;
  string attempt_id = 3;
  string result = 4;
}

// Worker 正常执行结束并生成完整 Report.
export message WorkerReplyReport {
  string pool = 1;
  RoleInstance worker = 2;
  ReportData report = 3;
}

// Worker 执行前校验拒绝; 在传输契约侧映射为明确未交付.
export message WorkerReplyRejected {
  string pool = 1;
  RoleInstance worker = 2;
  string operation_id = 3;
  string attempt_id = 4;
  string reason = 5;
}

// Worker 执行期失败且未生成 Report; 在传输契约侧映射为结果未知.
export message WorkerReplyFailed {
  string pool = 1;
  RoleInstance worker = 2;
  string operation_id = 3;
  string attempt_id = 4;
  string reason = 5;
}

// Worker 对单次 WorkerCall 的一次性线格式回复.
export message WorkerReply {
  oneof kind {
    WorkerReplyReport report = 1;
    WorkerReplyRejected rejected = 2;
    WorkerReplyFailed failed = 3;
  }
}
