[package]
name = "brocado"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["md3", "winit"]
md3 = ["dep:brocado-md3"]
winit = ["dep:brocado-winit"]

[[example]]
name = "theme_gallery"
required-features = ["winit"]

[dependencies]
brocado-core.workspace = true
brocado-md3 = { workspace = true, optional = true }
brocado-winit = { workspace = true, optional = true }
masonry.workspace = true
xilem_core.workspace = true
xilem_masonry.workspace = true

[dev-dependencies]
anyhow.workspace = true
brocado-preview.workspace = true
clap.workspace = true
image.workspace = true
masonry_testing.workspace = true
serde_json.workspace = true
tokio.workspace = true
