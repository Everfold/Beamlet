[package]
name = "xilem-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["adwaita", "fluent", "hig", "md3"]
adwaita = ["dep:xilem-adwaita"]
fluent = ["dep:xilem-fluent"]
hig = ["dep:xilem-hig"]
md3 = ["dep:xilem-md3"]

[dependencies]
xilem.workspace = true
xilem-adwaita = { workspace = true, optional = true }
xilem-fluent = { workspace = true, optional = true }
xilem-hig = { workspace = true, optional = true }
xilem-md3 = { workspace = true, optional = true }
xilem-ui-core.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true
image.workspace = true
masonry_testing.workspace = true
serde_json.workspace = true
tokio.workspace = true
xilem-preview.workspace = true
