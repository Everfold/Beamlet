[workspace]
resolver = "3"
members = [
  "apps/beamlet-console",
  "apps/beamlet-node",
  "apps/everfold-desktop",

  "crates/core/beamlet-api",
  "crates/core/beamlet-kernel",
  "crates/core/beamlet-ledger",
  "crates/core/beamlet-primitives",

  "crates/components/beamlet-authority",
  "crates/components/beamlet-client",
  "crates/components/beamlet-worker",

  "crates/transports/beamlet-protocol",
  "crates/transports/beamlet-transport-local",
  "crates/transports/beamlet-transport-nats",

  "crates/app-support/beamlet-app-config",
  "crates/app-support/beamlet-host",

  "ui/brocado",
  "ui/brocado-adwaita",
  "ui/brocado-core",
  "ui/brocado-fluent",
  "ui/brocado-hig",
  "ui/brocado-md3",
  "ui/brocado-preview",
  "ui/brocado-winit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
readme = "README.md"
repository = "https://github.com/Everfold/Beamlet"
license = "Apache-2.0"

[workspace.dependencies]
beamlet-api = { path = "crates/core/beamlet-api" }
beamlet-app-config = { path = "crates/app-support/beamlet-app-config" }
beamlet-authority = { path = "crates/components/beamlet-authority" }
beamlet-client = { path = "crates/components/beamlet-client" }
beamlet-host = { path = "crates/app-support/beamlet-host" }
beamlet-kernel = { path = "crates/core/beamlet-kernel" }
beamlet-ledger = { path = "crates/core/beamlet-ledger" }
beamlet-primitives = { path = "crates/core/beamlet-primitives" }
beamlet-protocol = { path = "crates/transports/beamlet-protocol" }
beamlet-transport-local = { path = "crates/transports/beamlet-transport-local" }
beamlet-transport-nats = { path = "crates/transports/beamlet-transport-nats" }
beamlet-worker = { path = "crates/components/beamlet-worker" }

futures = "0.3"
rayon = "1.12"
state-machines = { version = "0.34", features = ["async"] }
tokio = { version = "1.54", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

async-nats = "0.52"
zenoh = { version = "1.10", features = ["shared-memory", "stats"] }

axum = { version = "0.8", features = ["http2", "ws"] }
tower = "0.5"
tower-http = "0.7"

genai = "0.7"
reqwest = { version = "0.13", features = ["brotli", "cookies", "deflate", "gzip", "json", "socks", "stream", "zstd"] }

rquickjs = { version = "0.14", features = ["full"] }
rune = "0.14"
wasmtime = "50"
wasmtime-wasi = "50"

confy = { version = "2", default-features = false, features = ["ron_conf"] }
diesel = { version = "2.4", features = ["sqlite"] }
ron = "0.12"
tempfile = "3.27"

blake3 = { version = "1.8", features = ["rayon"] }
chrono = "0.4"
uuid = { version = "1.29", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4.6", features = ["derive", "string", "unicode"] }
reedline = { version = "0.52", features = ["bashisms", "sqlite", "system_clipboard"] }
tachyonfx = "0.25"

brocado = { path = "ui/brocado" }
brocado-adwaita = { path = "ui/brocado-adwaita" }
brocado-core = { path = "ui/brocado-core" }
brocado-fluent = { path = "ui/brocado-fluent" }
brocado-hig = { path = "ui/brocado-hig" }
brocado-md3 = { path = "ui/brocado-md3" }
brocado-preview = { path = "ui/brocado-preview" }
brocado-winit = { path = "ui/brocado-winit" }
image = { version = "0.25", default-features = false, features = ["png"] }
masonry = { git = "https://github.com/linebender/xilem.git" }
masonry_testing = { git = "https://github.com/linebender/xilem.git" }
masonry_winit = { git = "https://github.com/linebender/xilem.git" }
usvg = "0.47"
xilem_core = { git = "https://github.com/linebender/xilem.git" }
xilem_masonry = { git = "https://github.com/linebender/xilem.git" }

foundations = "5.11"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = "0.33"
opentelemetry-stdout = "0.33"

tracing = "0.1"
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"

criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.12"

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = true
codegen-units = 1
