[workspace]
resolver = "3"
members = [
  "apps/beamlet-console",
  "apps/beamlet-node",

  "crates/beamlet-api",
  "crates/beamlet-authority",
  "crates/beamlet-kernel",
  "crates/beamlet-ledger",
  "crates/beamlet-primitives",
  "crates/beamlet-protocol",
  "crates/beamlet-transport-local",
  "crates/beamlet-transport-nats",
  "crates/beamlet-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
readme = "README.md"
repository = "https://github.com/Everfold/Beamlet"
license = "Apache-2.0"

[workspace.dependencies]
beamlet-api = { path = "crates/beamlet-api" }
beamlet-authority = { path = "crates/beamlet-authority" }
beamlet-kernel = { path = "crates/beamlet-kernel" }
beamlet-ledger = { path = "crates/beamlet-ledger" }
beamlet-primitives = { path = "crates/beamlet-primitives" }
beamlet-protocol = { path = "crates/beamlet-protocol" }
beamlet-transport-local = { path = "crates/beamlet-transport-local" }
beamlet-transport-nats = { path = "crates/beamlet-transport-nats" }
beamlet-worker = { path = "crates/beamlet-worker" }

futures = "0.3"
rayon = "1.12"
state-machines = { version = "0.34", features = ["async"] }
tokio = { version = "1.54", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

async-nats = "0.51"
zenoh = { version = "1.10", features = ["shared-memory", "stats"] }

axum = { version = "0.8", features = ["http2", "ws"] }
tower = "0.5"
tower-http = "0.7"

genai = "0.7"
reqwest = { version = "0.13", features = ["brotli", "cookies", "deflate", "gzip", "json", "socks", "stream", "zstd"] }

rquickjs = { version = "0.14", features = ["full"] }
rune = "0.14"
wasmtime = "50"
wasmtime-wasi = "50"

confy = { version = "2", default-features = false, features = ["ron_conf"] }
diesel = { version = "2.4", features = ["sqlite"] }
tempfile = "3.27"

blake3 = { version = "1.8", features = ["rayon"] }
chrono = "0.4"
uuid = { version = "1.29", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4.6", features = ["derive", "string", "unicode"] }
reedline = { version = "0.52", features = ["bashisms", "sqlite", "system_clipboard"] }
tachyonfx = "0.25"

foundations = "5.11"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = "0.33"
opentelemetry-stdout = "0.33"

tracing = "0.1"
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"

criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.12"

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = true
codegen-units = 1
